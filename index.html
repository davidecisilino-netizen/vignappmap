<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>VignaPlanner Campo</title>
<meta name="description" content="Consulta in campo, con il GPS del cellulare, i vigneti creati con VignaPlanner: varietà, filari e viti su mappa.">
<meta name="theme-color" content="#1a4a1a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VignaPlanner Campo">
<link rel="icon" href="icons/icon-192.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!-- Leaflet-Rotate: aggiunge a Leaflet la possibilità di ruotare liberamente la mappa (orientamento a piacimento, non solo nord in alto) -->
<script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>

<style>
:root{
  --g1:#0e2f0e; --g2:#1a4a1a; --g3:#2d7a2d; --g4:#6b8f6b; --g5:#e8f2e8;
  --bg:#0e1410; --panel:#12291a; --panel2:#173b21; --line:#25502e;
  --text:#eef7ee; --text2:#a9c7ac; --accent:#ffc107; --danger:#e05353; --blue:#1e88e5;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;overscroll-behavior:none;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); display:flex; flex-direction:column; height:100vh; height:100dvh;
}
#topbar{
  display:flex; align-items:center; gap:8px; padding:calc(8px + var(--safe-top)) 10px 8px;
  background:var(--g1); border-bottom:1px solid var(--line); z-index:1000; flex-shrink:0;
}
#topbar h1{font-size:15px; margin:0; font-weight:700; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.icon-btn{
  background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:10px;
  width:38px; height:38px; display:flex; align-items:center; justify-content:center; font-size:17px; cursor:pointer; flex-shrink:0;
}
.icon-btn:active{background:var(--g3);}
#mapWrap{flex:1; position:relative; min-height:0;}
#map{width:100%; height:100%; background:#0a1a0a;}

.leaflet-popup-content-wrapper{background:var(--panel); color:var(--text); border-radius:10px;}
.leaflet-popup-tip{background:var(--panel);}
.leaflet-popup-content{margin:10px 12px; font-size:13px; line-height:1.5;}
.leaflet-control-attribution{font-size:9px; background:rgba(14,20,16,.7)!important; color:#9c9!important;}
.leaflet-control-attribution a{color:#bcd!important;}

.pp-title{font-weight:700; font-size:14px; margin-bottom:2px;}
.pp-row{display:flex; justify-content:space-between; gap:10px;}
.pp-lbl{color:var(--text2);}
.pp-dot{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:-1px; border:1px solid rgba(255,255,255,.4);}

/* Empty state overlay */
#emptyState{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column;
  gap:14px; padding:30px; text-align:center; background:var(--bg); z-index:500;
}
#emptyState .es-icon{font-size:48px; opacity:.5;}
#emptyState h2{margin:0; font-size:18px;}
#emptyState p{margin:0; color:var(--text2); font-size:13.5px; max-width:320px; line-height:1.5;}
.btn{
  background:var(--g3); color:#fff; border:none; padding:11px 18px; border-radius:10px; font-size:14.5px;
  font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:8px;
}
.btn:active{background:var(--g2);}
.btn.secondary{background:var(--panel2); border:1px solid var(--line); color:var(--text);}
.btn.small{padding:7px 12px; font-size:12.5px; border-radius:8px;}

/* Floating GPS/status pill */
#gpsStatus{
  position:absolute; top:10px; left:10px; right:10px; z-index:600; display:flex; gap:8px; pointer-events:none;
}
.pill{
  background:rgba(18,41,26,.92); border:1px solid var(--line); color:var(--text2); font-size:11.5px;
  padding:6px 10px; border-radius:20px; pointer-events:auto; display:flex; align-items:center; gap:6px;
}
.pill b{color:var(--text); font-weight:600;}
.pill.warn{color:var(--accent); border-color:#5a4a1a;}
.pill.err{color:var(--danger); border-color:#5a2626;}

/* Floating action buttons bottom-right */
#fabs{position:absolute; right:10px; bottom:calc(10px + var(--safe-bottom)); z-index:600; display:flex; flex-direction:column; gap:10px;}
.fab{
  width:48px; height:48px; border-radius:50%; background:var(--panel2); border:1px solid var(--line); color:var(--text);
  font-size:20px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 10px rgba(0,0,0,.4); cursor:pointer;
}
.fab.active{background:var(--blue); border-color:var(--blue); color:#fff;}
.fab.fab-on{background:var(--g3); border-color:var(--g3); color:#fff;}
.fab:active{transform:scale(.94);}
#btnCompass{position:relative;}
#btnCompass .compass-needle{display:inline-block; font-size:19px; transition:transform .12s linear; transform-origin:50% 50%;}
#btnCompass.rotated{background:var(--panel2); border-color:var(--accent);}
#btnCompass .compass-needle .n{color:#e05353;}
#btnCompass .compass-needle .s{color:#cfd8dc;}
#btnCompass .deg-badge{
  position:absolute; bottom:-6px; left:50%; transform:translateX(-50%); background:var(--accent); color:#1a1a0e;
  font-size:9px; font-weight:700; padding:1px 5px; border-radius:8px; white-space:nowrap; display:none;
}
#btnCompass.rotated .deg-badge{display:block;}

/* Bottom sheet: list of vigneti / varieties, legend */
#sheet{
  position:absolute; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line);
  border-radius:16px 16px 0 0; z-index:700; max-height:72vh; display:flex; flex-direction:column;
  transform:translateY(100%); transition:transform .25s ease; box-shadow:0 -4px 20px rgba(0,0,0,.4);
}
#sheet.open{transform:translateY(0);}
#sheetHandle{width:38px; height:4px; background:var(--line); border-radius:3px; margin:9px auto 4px;}
#sheetHead{display:flex; align-items:center; gap:8px; padding:2px 14px 8px; border-bottom:1px solid var(--line);}
#sheetHead h3{font-size:14px; margin:0; flex:1;}
#sheetTabs{display:flex; gap:6px; padding:8px 12px 0;}
.tabbtn{flex:1; text-align:center; padding:8px 4px; border-radius:8px; font-size:12.5px; font-weight:600; color:var(--text2); background:var(--panel2); border:1px solid var(--line); cursor:pointer;}
.tabbtn.active{background:var(--g3); color:#fff; border-color:var(--g3);}
#sheetBody{overflow-y:auto; padding:10px 14px 16px; flex:1;}

.search-box{
  width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:10px;
  padding:9px 12px; font-size:14px; margin-bottom:10px;
}
.search-box::placeholder{color:#5f7f63;}

.vig-item{
  background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; cursor:pointer;
}
.vig-item.disabled{opacity:.4;}
.vig-item .vi-top{display:flex; justify-content:space-between; align-items:center; gap:8px;}
.vig-item h4{margin:0; font-size:14.5px;}
.vig-item .vi-meta{font-size:11.5px; color:var(--text2); margin-top:4px; display:flex; gap:10px; flex-wrap:wrap;}
.chk{width:20px; height:20px; border-radius:6px; border:2px solid var(--g4); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px;}
.chk.on{background:var(--g3); border-color:var(--g3);}
.vig-item .vi-vars{display:flex; flex-wrap:wrap; gap:5px; margin-top:7px;}
.vig-meta-grid{display:flex; flex-wrap:wrap; gap:5px 14px; margin-top:8px; padding-top:8px; border-top:1px solid var(--line);}
.vig-meta-grid .vmi{font-size:11px;}
.vig-meta-grid .vml{color:var(--text2); margin-right:3px;}
.vig-meta-grid .vmv{color:var(--text); font-weight:600;}
.vig-struttura{margin-top:8px; padding-top:8px; border-top:1px solid var(--line);}
.vig-struttura .vs-title{font-size:11px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.4px; margin-bottom:6px;}
.vig-struttura .vs-row{font-size:11px; color:var(--text2); margin-bottom:5px;}
.vig-struttura .vs-row .vml{color:var(--text2); margin-right:3px;}
.vig-struttura .vs-row .vmv{color:var(--text); font-weight:600;}
.vig-struttura .vs-fili{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:6px;}
.vs-filo{font-size:10.5px; padding:2px 7px; border-radius:8px; background:var(--bg); border:1px solid var(--line); color:var(--text2); white-space:nowrap;}
.vs-filo b{color:var(--text); font-weight:700;}
.vs-filo.banchina{border-color:var(--accent); color:var(--accent);}
.vs-filo.banchina b{color:var(--accent);}
.vig-note{font-size:11px; color:var(--text2); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; margin-top:8px; overflow-wrap:anywhere;}
.vtag{font-size:10.5px; padding:2px 7px; border-radius:8px; background:var(--bg); border:1px solid var(--line); display:flex; align-items:center; gap:4px;}

.var-item{display:flex; align-items:flex-start; gap:10px; padding:9px 4px; border-bottom:1px solid var(--line); font-size:13.5px; flex-wrap:wrap;}
.var-item .vc{width:14px; height:14px; border-radius:50%; flex-shrink:0; border:1px solid rgba(255,255,255,.35); margin-top:2px;}
.var-item .vi-main{flex:1; min-width:0;}
.var-item .vn-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.var-item .vn{font-weight:600;}
.var-item .vcount{color:var(--text2); font-size:12px; white-space:nowrap;}
.var-filari{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px;}
.ftag{font-size:10.5px; padding:2px 7px; border-radius:8px; background:var(--bg); border:1px solid var(--line); color:var(--text2); white-space:nowrap;}
.ftag b{color:var(--text); font-weight:700;}

#stack-info{font-size:12.5px; color:var(--text2); line-height:1.6;}
#stack-info b{color:var(--text);}
.info-block{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px;}

input[type=file]{display:none;}

.toast{
  position:fixed; left:50%; bottom:calc(24px + var(--safe-bottom)); transform:translateX(-50%);
  background:#111; color:#fff; padding:10px 16px; border-radius:10px; font-size:13px; z-index:2000;
  opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; max-width:88vw; text-align:center;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

#sheetScrim{position:absolute; inset:0; background:rgba(0,0,0,.35); z-index:650; opacity:0; pointer-events:none; transition:opacity .2s;}
#sheetScrim.show{opacity:1; pointer-events:auto;}

/* Overlay di caricamento, mostrato durante l'elaborazione di import pesanti */
#loadingOverlay{
  position:absolute; inset:0; z-index:1500; display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:14px; background:rgba(14,20,16,.88);
}
#loadingOverlay p{margin:0; color:var(--text2); font-size:13.5px;}
.spinner{
  width:34px; height:34px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--g3);
  animation:vpm-spin .8s linear infinite;
}
@keyframes vpm-spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<div id="topbar">
  <button class="icon-btn" id="btnMenu" title="Vigneti e varietà">☰</button>
  <h1 id="titleTxt">VignaPlanner Campo</h1>
  <button class="icon-btn" id="btnImport" title="Importa JSON dal desktop">⇪</button>
</div>

<div id="mapWrap">
  <div id="map"></div>

  <div id="gpsStatus"></div>

  <div id="fabs">
    <div class="fab" id="btnCompass" title="Ruota la mappa con due dita — tocca per riportarla a nord">
      <span class="compass-needle" id="compassNeedle"><span class="n">▲</span><span class="s">▽</span></span>
      <span class="deg-badge" id="compassDeg">0°</span>
    </div>
    <div class="fab" id="btnLocate" title="Vai alla mia posizione">◎</div>
    <div class="fab fab-on" id="btnLabels" title="Mostra/nascondi etichette numero filare" style="font-size:12px;font-weight:700">F1</div>
    <div class="fab" id="btnLabelsVar" title="Mostra/nascondi etichette filare con varietà" style="font-size:10.5px;font-weight:700;line-height:1.05">F1<br>var</div>
    <div class="fab" id="btnLayers" title="Cambia mappa" style="font-size:11px;font-weight:700;letter-spacing:.3px">SAT</div>
  </div>

  <div id="sheetScrim"></div>
  <div id="sheet">
    <div id="sheetHandle"></div>
    <div id="sheetHead"><h3 id="sheetTitle">Vigneti</h3><button class="icon-btn" id="btnCloseSheet" style="width:32px;height:32px;font-size:15px">✕</button></div>
    <div id="sheetTabs">
      <div class="tabbtn active" data-tab="vigneti">▣ Vigneti</div>
      <div class="tabbtn" data-tab="varieta">◆ Varietà</div>
      <div class="tabbtn" data-tab="info">ⓘ Dati</div>
    </div>
    <div id="sheetBody"></div>
  </div>

  <div id="emptyState" style="display:none">
    <div class="es-icon">▣</div>
    <h2>Nessun vigneto caricato</h2>
    <p>Nel VignaPlanner desktop, apri la scheda <b>“▣ Vigneti”</b> e premi <b>“↓ Esporta JSON”</b>: si scarica il file <b>vigneti_ERSA.json</b>. Caricalo qui sotto per vederlo in mappa con il GPS.</p>
    <button class="btn" id="btnImportEmpty">⇪ Carica file JSON</button>
  </div>

  <div id="loadingOverlay" style="display:none">
    <div class="spinner"></div>
    <p id="loadingMsg">Elaborazione…</p>
  </div>
</div>

<input type="file" id="fileInput" accept="application/json,.json">
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   VignaPlanner Campo — visualizzatore mobile GPS per i vigneti VignaPlanner
   Legge il file "vigneti_ERSA.json" prodotto dal pulsante "↓ Esporta JSON"
   della scheda "Vigneti salvati" del planner desktop e ne calcola la
   proiezione geografica reale (stesso algoritmo del planner) di filari,
   viti e pali, per consultarla in campo con il GPS del telefono.
   ========================================================================= */

const LS_KEY = 'vpm_vigneti_v1';
const LS_VIS_KEY = 'vpm_visibili_v1';
const LS_LBL_KEY = 'vpm_mostra_etichette_v1';
const LS_LBLVAR_KEY = 'vpm_mostra_etichette_varieta_v1';
const LS_SIM_KEY = 'vpm_simboli_sist_v1'; // simboli mappa per sistema di allevamento (vedi DB Allevamento nel desktop)

let vigneti = [];          // array grezzo caricato dal JSON (uno o più vigneti)
let vignetiCalc = [];      // stessi vigneti + geometria calcolata (filari/piante/pali) e layer leaflet
let visibili = {};         // id -> bool, quali vigneti mostrare in mappa
let mostraEtichette = true; // mostra/nasconde le etichette numero-filare (F1, F2...) in mappa
let mostraEtichetteVarieta = false; // mostra/nasconde le etichette filare+varietà (F1 Merlot / F2 Misto / F3 Ampelo)
let sistemiAllevamentoSimboli = {}; // nome sistema -> id forma, importato dal desktop (DB Allevamento)
let map, gpsMarker, gpsCircle, watchId = null, followGps = false;
let currentTab = 'vigneti';
let tileLayers = {}, currentTileKey = 'osm';

// Restituisce il simbolo mappa assegnato a un sistema di allevamento (vedi DB Allevamento nel
// planner desktop); se il file importato non ha ancora questa informazione (vecchio formato)
// o il sistema non è mappato, ricade sul cerchio classico.
function getSistSymbol(nome){
  return (nome && sistemiAllevamentoSimboli[nome]) || 'cerchio';
}
// ══ SIMBOLI VITE: poligoni vettoriali Leaflet a dimensione FISSA in pixel ══
// Tentativo precedente: poligoni con vertici a un piccolo raggio "reale" (~17cm) in modo che
// Leaflet li riproiettasse da sé come qualsiasi geometria geografica. Risultato: a un raggio
// di 17cm, ai livelli di zoom normalmente usati passeggiando in vigna (18-20), il poligono
// occupa MENO DI UN PIXEL sullo schermo — sostanzialmente invisibile. Il cerchio invece è un
// L.circleMarker con raggio fisso in PIXEL (5px sempre, a qualunque zoom), quindi ben visibile:
// da qui "si vedono solo i cerchi, non i rombi".
// Soluzione corretta: mantenere anche i poligoni a dimensione fissa in PIXEL come il cerchio,
// ricalcolandone i vertici (pochi conti trigonometrici, nessuna ricostruzione della geometria
// pesante) ogni volta che lo zoom cambia — esattamente come già si fa per le etichette dei
// filari (vedi pianificaAggiornaEtichette in initMap). Restano comunque veri layer vettoriali
// Leaflet, disegnati dallo stesso renderer canvas di pali/filari/cerchi (nessuna icona DOM),
// quindi sempre nello stesso pannello e mai "sganciati" durante pan/rotazione.
const _formeViteReg = []; // {poly, ll, forma, r} — tutte le viti non-cerchio attualmente costruite, per il ricalcolo su zoom (vedi aggiornaFormeVite)

// Offset in pixel (dx,dy — convenzione schermo, y verso il basso) dei vertici del poligono
// regolare di ciascuna forma; null per il cerchio, che non è un poligono ma un L.circleMarker.
function verticiFormaPixel(forma,r){
  switch(forma){
    case 'quadrato': return [[-r*.85,-r*.85],[r*.85,-r*.85],[r*.85,r*.85],[-r*.85,r*.85]];
    case 'rombo': return [[0,-r*1.15],[r*1.15,0],[0,r*1.15],[-r*1.15,0]];
    case 'triangolo': return [[0,-r*1.15],[r,r*.85],[-r,r*.85]];
    case 'triangoloGiu': return [[0,r*1.15],[r,-r*.85],[-r,-r*.85]];
    case 'stella': { const p=[]; const punte=5,rE=r*1.25,rI=r*0.5;
      for(let i=0;i<punte*2;i++){ const ang=(Math.PI/punte)*i-Math.PI/2; const rr=i%2===0?rE:rI; p.push([Math.cos(ang)*rr,Math.sin(ang)*rr]); } return p; }
    case 'esagono': { const p=[]; for(let i=0;i<6;i++){ const ang=(Math.PI/3)*i-Math.PI/2; p.push([Math.cos(ang)*r*1.15,Math.sin(ang)*r*1.15]); } return p; }
    case 'croce': { const b=r*0.5, L=r*1.15;
      return [[-b,-L],[b,-L],[b,-b],[L,-b],[L,b],[b,b],[b,L],[-b,L],[-b,b],[-L,b],[-L,-b],[-b,-b]]; }
    default: return null; // cerchio
  }
}
// Converte gli offset in pixel della forma, centrati su ll, in coordinate lat/lng correnti
// (dipende dallo zoom attuale della mappa: ecco perché va richiamata ad ogni zoomend).
function poligonoLatLngsPixel(ll,forma,r){
  const c = map.latLngToContainerPoint(ll);
  return verticiFormaPixel(forma,r).map(([dx,dy])=>map.containerPointToLatLng([c.x+dx,c.y+dy]));
}
// Crea il marker di una vite: L.circleMarker per il cerchio (come da sempre), L.polygon per
// le altre forme — entrambi vettoriali, canvas-rendered, stesso pannello di pali e filari,
// entrambi a dimensione fissa in pixel indipendente dallo zoom.
function creaMarkerVite(ll,forma,colore,sizePx){
  const r = sizePx/2;
  if(!forma || forma==='cerchio'){
    return L.circleMarker(ll,{radius:r, fillColor:colore, fillOpacity:.92, color:'#fff', weight:1});
  }
  const poly = L.polygon(poligonoLatLngsPixel(ll,forma,r),{fillColor:colore, fillOpacity:.92, color:'#fff', weight:1});
  _formeViteReg.push({poly,ll,forma,r});
  return poly;
}
// Richiamata una sola volta a fine zoom (mai durante il gesto): ricalcola solo i vertici dei
// poligoni già esistenti, un conto economico che non tocca filari/pali/etichette.
function aggiornaFormeVite(){
  _formeViteReg.forEach(e=>{ e.poly.setLatLngs(poligonoLatLngsPixel(e.ll,e.forma,e.r)); });
}


// ---------- utilità UI ----------
function toast(msg, ms){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove('show'), ms||2600);
}
// Con vigneti molto grandi, l'elaborazione (calcolo geometria + creazione di migliaia di
// marker) può richiedere qualche secondo, tutto sincrono: senza un indicatore l'app
// sembrerebbe bloccata. mostraCaricamento va chiamata, e poi il lavoro pesante rimandato
// con un breve setTimeout, così il browser fa in tempo a disegnare l'overlay PRIMA che il
// thread principale si blocchi con il calcolo vero e proprio.
function mostraCaricamento(msg){
  document.getElementById('loadingMsg').textContent = msg||'Elaborazione…';
  document.getElementById('loadingOverlay').style.display = 'flex';
}
function nascondiCaricamento(){
  document.getElementById('loadingOverlay').style.display = 'none';
}
function uidVigneto(v, idx){ return v.id || (v.nome+'_'+idx); }

// ---------- replica ESATTA dell'algoritmo geometrico del VignaPlanner desktop ----------
// (stesse formule di offsetVerticeNW / posFilare / numFilare / numVite / calcolaGeom)
function offsetVerticeNW(vtx, maxL, H){
  const cx = maxL/2, cy = H/2;
  switch(vtx){
    case 'NW': return {dx:0,dy:0};
    case 'N':  return {dx:-cx,dy:0};
    case 'NE': return {dx:-maxL,dy:0};
    case 'W':  return {dx:0,dy:-cy};
    case 'E':  return {dx:-maxL,dy:-cy};
    case 'SW': return {dx:0,dy:-H};
    case 'S':  return {dx:-cx,dy:-H};
    case 'SE': return {dx:-maxL,dy:-H};
    default:   return {dx:0,dy:0};
  }
}
function calcolaGeomVigneto(v){
  const meta = v.meta || {};
  const mapPos = v.mapPos || {};
  const filari = v.filari || [];
  if(!filari.length || mapPos.lat==null || mapPos.lng==null) return null;

  const lat = mapPos.lat, lng = mapPos.lng, rotDeg = mapPos.rot||0;
  const vtx = mapPos.vertice || 'NW';
  const interFilare = meta.interFilare || 2.2;
  const invertFilari = !!meta.invertFilari;
  const invertViti = !!meta.invertViti;
  const invertOrdineFisico = !!meta.invertOrdineFisico;
  const distPali = meta.distPali || 5;

  const DL = 1/111320;
  const DLn = 1/(111320*Math.cos(lat*Math.PI/180));
  const rot = rotDeg*Math.PI/180;
  const cos = Math.cos(rot), sin = Math.sin(rot);
  function off(dx,dy){ return [lat+(dx*sin-dy*cos)*DL, lng+(dx*cos+dy*sin)*DLn]; }

  const maxL = filari.reduce((m,f)=>Math.max(m, f.lunghezza||0), 0);
  const H = (filari.length-1)*interFilare;
  const o = offsetVerticeNW(vtx, maxL, H);
  const [nwLat, nwLng] = off(o.dx, o.dy);
  function offNW(dx,dy){ return [nwLat+(dx*sin-dy*cos)*DL, nwLng+(dx*cos+dy*sin)*DLn]; }

  function posFilare(idx){ return invertOrdineFisico ? (filari.length-1-idx) : idx; }
  function numFilare(idx){ return invertFilari ? filari.length-idx : idx+1; }
  function numVite(idx, tot){ return invertViti ? tot-idx : idx+1; }

  const vars = v.vars || [];
  function getV(id){ return vars.find(x=>x.id===id) || null; }

  const righe = filari.map((f, fi)=>{
    const dy = posFilare(fi)*interFilare;
    const fLine = [ offNW(0,dy), offNW(f.lunghezza,dy) ];
    const piante = (f.piante||[]).map((p,pi)=>({
      ll: offNW(pi*(f.distViti||1), dy), p, numero: numVite(pi, f.piante.length)
    }));
    const nPali = Math.floor((f.lunghezza||0)/distPali)+1;
    const pali = Array.from({length:nPali}, (_,pp)=>offNW(pp*distPali, dy));
    return { f, fi, numero:numFilare(fi), fLine, piante, pali };
  });

  return { righe, getV, vars, interFilare, lat };
}

// Con un interfilare tipico di 2-2.5 m, lo spazio fra due filari in pixel è quasi sempre
// inferiore all'altezza di un'etichetta leggibile, a qualunque zoom ragionevole per il
// lavoro in campo: mostrare un'etichetta per OGNI filare le farebbe quindi sovrapporre le une
// alle altre pressoché sempre. La soluzione è mostrarne una ogni "passo" filari, calcolato
// dinamicamente in base allo zoom corrente, in modo che due etichette consecutive abbiano
// sempre almeno "labelH" pixel di distanza fra loro: più ci si avvicina con lo zoom, più il
// passo si riduce, fino a mostrare l'etichetta di ogni singolo filare quando lo spazio basta.
function passoEtichette(lat, interFilare, zoom, labelH){
  const pixelPerMetro = Math.pow(2,zoom)/(156543.03392*Math.cos(lat*Math.PI/180));
  const gapPx = interFilare*pixelPerMetro;
  return Math.max(1, Math.ceil(labelH/gapPx));
}

// ---------- caricamento / persistenza ----------
// Salva l'intero dataset importato: operazione potenzialmente pesante (può contenere
// migliaia di viti), va chiamata SOLO quando il dataset cambia davvero (import, cancellazione)
// — MAI per un semplice toggle di visibilità, che usa invece la più leggera salvaVisibilita().
function salvaVigneti(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(vigneti));
  }catch(e){
    console.error(e);
    toast('⚠ Impossibile salvare i dati sul telefono (spazio esaurito?): potrebbero non essere disponibili alla riapertura', 4200);
  }
}
// Salva solo quali vigneti sono accesi/spenti in mappa: un oggetto di poche decine di
// booleani, scrittura istantanea anche con dataset molto grandi — usata ad ogni toggle.
function salvaVisibilita(){
  try{ localStorage.setItem(LS_VIS_KEY, JSON.stringify(visibili)); }catch(e){}
}
function salvaPrefEtichette(){
  try{ localStorage.setItem(LS_LBL_KEY, JSON.stringify(mostraEtichette)); }catch(e){}
  try{ localStorage.setItem(LS_LBLVAR_KEY, JSON.stringify(mostraEtichetteVarieta)); }catch(e){}
}
function caricaLocale(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ vigneti = JSON.parse(raw); }
  }catch(e){ vigneti = []; }
  try{
    const rawV = localStorage.getItem(LS_VIS_KEY);
    if(rawV) visibili = JSON.parse(rawV);
  }catch(e){ visibili = {}; }
  try{
    const rawL = localStorage.getItem(LS_LBL_KEY);
    if(rawL!=null) mostraEtichette = JSON.parse(rawL);
  }catch(e){ mostraEtichette = true; }
  try{
    const rawLV = localStorage.getItem(LS_LBLVAR_KEY);
    if(rawLV!=null) mostraEtichetteVarieta = JSON.parse(rawLV);
  }catch(e){ mostraEtichetteVarieta = false; }
  try{
    const rawS = localStorage.getItem(LS_SIM_KEY);
    if(rawS) sistemiAllevamentoSimboli = JSON.parse(rawS);
  }catch(e){ sistemiAllevamentoSimboli = {}; }
}

function importaJson(data){
  let arr;
  if(Array.isArray(data)) arr = data;                    // esportaTuttiVigneti() vecchio formato: array di vigneti
  else if(Array.isArray(data.vigneti)) arr = data.vigneti; // formato attuale {vigneti, sistemiAllevamentoSimboli} o backup completo (vp31)
  else if(data.nome && (data.filari||data.mapPos)) arr = [data]; // singolo vigneto
  else { toast('⚠ File non riconosciuto: usa "↓ Esporta JSON" dalla scheda Vigneti'); return; }

  if(!arr.length){ toast('⚠ Il file non contiene vigneti salvati'); return; }

  vigneti = arr;
  visibili = {};
  arr.forEach((v,i)=>{ visibili[uidVigneto(v,i)] = true; });
  // Simboli mappa per sistema di allevamento (DB Allevamento del desktop): se il file li
  // contiene li aggiorna, altrimenti restano quelli già salvati da un import precedente.
  if(data.sistemiAllevamentoSimboli){
    sistemiAllevamentoSimboli = data.sistemiAllevamentoSimboli;
    try{ localStorage.setItem(LS_SIM_KEY, JSON.stringify(sistemiAllevamentoSimboli)); }catch(e){}
  }
  salvaVigneti();
  salvaVisibilita();
  ricalcolaTutto();
  toast('✓ Importati '+arr.length+' vigneti');
  document.getElementById('emptyState').style.display='none';
}

function gestisciFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    mostraCaricamento('Elaborazione vigneti…');
    // Il setTimeout (anche brevissimo) rimanda il parsing/elaborazione pesante al prossimo
    // giro dell'event loop, dando al browser il tempo di disegnare l'overlay PRIMA che il
    // thread principale si blocchi: altrimenti l'overlay e il lavoro pesante partirebbero
    // nello stesso frame e l'utente non vedrebbe mai l'indicatore di caricamento.
    setTimeout(()=>{
      try{
        const data = JSON.parse(e.target.result);
        importaJson(data);
      }catch(err){
        toast('⚠ File JSON non valido');
      }
      nascondiCaricamento();
    }, 30);
  };
  reader.onerror = ()=>{ nascondiCaricamento(); toast('⚠ Impossibile leggere il file'); };
  reader.readAsText(file);
}

// ---------- mappa ----------
function initMap(){
  map = L.map('map', {
    zoomControl:false, attributionControl:true,
    // Rendering su <canvas> invece che SVG: con centinaia/migliaia di viti e pali, SVG crea
    // un nodo DOM per ogni elemento (pesante da ridisegnare durante zoom/rotazione); canvas
    // disegna tutto su un'unica superficie bitmap, molto più leggera da spostare/scalare/ruotare
    // sui telefoni. È il singolo intervento con il maggiore impatto sulla fluidità dell'app.
    preferCanvas:true,
    // Rotazione libera della mappa: l'utente può orientarla come vuole
    // ruotando con due dita sullo schermo (gesto naturale, come Google/Apple Maps);
    // il pulsante bussola in basso a destra riporta la mappa a "nord in alto".
    rotate:true, bearing:0, rotateControl:false, touchRotate:true, shiftKeyRotate:true, compassBearing:false
  }).setView([45.94, 13.23], 12); // default: Friuli VG

  tileLayers.osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:20, attribution:'&copy; OpenStreetMap'
  });
  tileLayers.sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom:20, attribution:'Esri World Imagery'
  });
  tileLayers.osm.addTo(map);
  L.control.zoom({position:'bottomleft'}).addTo(map);

  map.on('dragstart', ()=>{ if(followGps){ followGps=false; document.getElementById('btnLocate').classList.remove('active'); } });
  map.on('rotate', aggiornaBussola);
  // Le etichette dei filari dipendono dal livello di zoom (per evitare che si sovrappongano
  // tra loro) e dalla direzione reale del filare sullo schermo (che può cambiare se la mappa
  // viene ruotata): vanno quindi aggiornate ad ogni cambio di zoom o rotazione. MA l'evento
  // 'rotate' si attiva IN CONTINUAZIONE durante il gesto (decine di volte al secondo, non solo
  // alla fine): ricostruire tutto ad ogni singolo evento è la causa principale degli scatti
  // segnalati. La soluzione è "debounce": si aggiornano solo le etichette (mai la geometria
  // pesante di viti/pali/filari, che Leaflet riposiziona da sé in modo nativo ed efficiente),
  // e solo ~150ms dopo l'ULTIMO evento di zoom/rotazione, quando il gesto si è fermato.
  let refreshEtichetteTimer = null;
  function pianificaAggiornaEtichette(){
    clearTimeout(refreshEtichetteTimer);
    refreshEtichetteTimer = setTimeout(()=>{ if(vignetiCalc.length) aggiornaEtichette(); }, 150);
  }
  map.on('zoomend', pianificaAggiornaEtichette);
  map.on('rotate', pianificaAggiornaEtichette);
  // Le forme non-cerchio (rombo, quadrato...) sono poligoni a dimensione fissa in PIXEL:
  // il loro "raggio" va ricalcolato a ogni cambio di zoom (mai durante la rotazione, che non
  // cambia la scala) — vedi aggiornaFormeVite. Costo trascurabile: solo trigonometria, nessun
  // accesso al DOM e nessun tocco alla geometria pesante di filari/pali.
  map.on('zoomend', aggiornaFormeVite);
  aggiornaBussola();
}

// ---------- rotazione mappa a piacimento (bussola) ----------
function aggiornaBussola(){
  const bearing = Math.round(map.getBearing ? map.getBearing() : 0);
  const btn = document.getElementById('btnCompass');
  const needle = document.getElementById('compassNeedle');
  const deg = document.getElementById('compassDeg');
  // la freccia indica sempre dove si trova il vero Nord rispetto all'orientamento attuale della mappa
  needle.style.transform = `rotate(${-bearing}deg)`;
  const norm = ((bearing%360)+360)%360;
  deg.textContent = norm+'°';
  btn.classList.toggle('rotated', Math.abs(((norm+180)%360)-180) > 1);
}
document.getElementById('btnCompass').addEventListener('click', ()=>{
  if(map.setBearing) map.setBearing(0);
});

function toggleTiles(){
  map.removeLayer(tileLayers[currentTileKey]);
  currentTileKey = currentTileKey==='osm' ? 'sat' : 'osm';
  tileLayers[currentTileKey].addTo(map);
  document.getElementById('btnLayers').textContent = currentTileKey==='osm' ? 'SAT' : 'MAPPA';
  toast(currentTileKey==='osm' ? 'Mappa stradale' : 'Vista satellitare');
}

let masterStruttura = null;  // contenitore sempre presente in mappa: raccoglie i layer dei singoli vigneti visibili
let layerEtichette = null;   // solo le etichette dei filari: leggero, ricostruito anche ad ogni zoom/rotazione (vedi pianificaAggiornaEtichette)
const LABEL_H = 20;        // altezza approssimativa (px) di un'etichetta filare, usata per calcolare il "passo" (vedi passoEtichette)
const LABEL_D_NUM = 26;    // distanza (px) dell'etichetta numero dall'inizio del filare, a piena scala (filare ≥80px a schermo — vedi scalaOffset in aggiornaEtichette)
const LABEL_D_VAR = 60;    // distanza (px) dell'etichetta filare+varietà dall'inizio del filare (più esterna, non si sovrappone alla precedente), a piena scala

// Costruisce il layer (viti, pali, filari, marker di ancoraggio) di UN SOLO vigneto. Viene
// chiamata una sola volta per vigneto e il risultato resta in cache in vc.layer: accendere e
// spegnere la visibilità di un vigneto in seguito non lo ricostruisce più da zero, si limita
// ad aggiungere/rimuovere questo layer già pronto — molto più veloce con più vigneti caricati.
function costruisciLayerVigneto(vc){
  const fg = L.featureGroup();
  const { righe, getV } = vc.geom;

  righe.forEach(r=>{
    L.polyline(r.fLine, {color:'#ffc107', weight:2.5, opacity:.85}).addTo(fg);

    r.piante.forEach(pl=>{
      const v = getV(pl.p.varietaId);
      const sistEff = pl.p.sistAllevamento || r.f.sistAllevamento || vc.v.meta?.sistPot || '';
      const marker = creaMarkerVite(pl.ll, getSistSymbol(sistEff), v?v.color:'#888', 10);
      // Anno di impianto: se la vite ha un anno personalizzato (reimpianto) prevale su
      // quello del filare, che a sua volta prevale sul default del vigneto — stessa
      // logica "a cascata" usata nel planner desktop.
      const annoEff = pl.p.annoImpianto!=null ? pl.p.annoImpianto
        : (r.f.annoImpianto!=null ? r.f.annoImpianto
        : (vc.v.meta?.annoImpianto!=null ? vc.v.meta.annoImpianto : null));
      const reimpianto = pl.p.annoImpianto!=null && r.f.annoImpianto!=null && pl.p.annoImpianto!==r.f.annoImpianto
        || (pl.p.annoImpianto!=null && r.f.annoImpianto==null && vc.v.meta?.annoImpianto!=null && pl.p.annoImpianto!==vc.v.meta.annoImpianto);
      marker.bindPopup(
        `<div class="pp-title"><span class="pp-dot" style="background:${v?v.color:'#888'}"></span>${v?v.nome:'—'}</div>`+
        `<div class="pp-row"><span class="pp-lbl">Vigneto</span><b>${vc.v.nome||'—'}</b></div>`+
        `<div class="pp-row"><span class="pp-lbl">Filare</span><b>F${r.numero}</b></div>`+
        `<div class="pp-row"><span class="pp-lbl">Vite</span><b>N.${pl.numero}</b></div>`+
        `<div class="pp-row"><span class="pp-lbl">Sistema allevamento</span><b>${sistEff || '—'}</b></div>`+
        (annoEff!=null?`<div class="pp-row"><span class="pp-lbl">Anno impianto</span><b>${annoEff}${reimpianto?' (reimpianto)':''}</b></div>`:'')+
        (pl.p.portainnesto?`<div class="pp-row"><span class="pp-lbl">Portainnesto</span><b>${pl.p.portainnesto}</b></div>`:'')+
        (pl.p.clone && pl.p.clone!=='—' ?`<div class="pp-row"><span class="pp-lbl">Clone</span><b>${pl.p.clone}</b></div>`:'')
      );
      marker.addTo(fg);
    });

    // interactive:false sui pali: non hanno popup né funzione al tocco, disattivare
    // il pointer-hit-testing per loro alleggerisce ulteriormente il rendering.
    r.pali.forEach(ll=>{
      L.circleMarker(ll, {radius:2.5, fillColor:'#8d6e63', fillOpacity:1, color:'#4e342e', weight:.5, interactive:false}).addTo(fg);
    });
  });

  // vertice di ancoraggio / marker vigneto
  if(vc.v.mapPos){
    L.marker([vc.v.mapPos.lat, vc.v.mapPos.lng], {
      icon: L.divIcon({className:'', iconAnchor:[9,9], iconSize:[18,18],
        html:`<div style="width:14px;height:14px;border-radius:50%;background:#1565c0;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)"></div>`})
    }).bindPopup(`<div class="pp-title">▣ ${vc.v.nome||'—'}</div>`+
      `<div class="pp-row"><span class="pp-lbl">Filari</span><b>${vc.v.totFilari||'—'}</b></div>`+
      `<div class="pp-row"><span class="pp-lbl">Piante</span><b>${vc.v.totPiante||'—'}</b></div>`+
      `<div class="pp-row"><span class="pp-lbl">Ettari</span><b>${vc.v.ha||'—'}</b></div>`
    ).addTo(fg);
  }

  return fg;
}

// Geometria "pesante": filari, viti, pali, marker di ancoraggio vigneto. Il layer di ogni
// vigneto viene costruito una sola volta (vedi costruisciLayerVigneto) e da quel momento in
// poi accendere/spegnere la visibilità è solo un addLayer/removeLayer su un layer già pronto
// — MAI una ricostruzione completa. La geometria non viene MAI toccata durante zoom/rotazione
// (Leaflet riposiziona da sé, in modo nativo ed efficiente, i layer già presenti in mappa).
function disegnaStruttura(){
  if(!masterStruttura) masterStruttura = L.layerGroup().addTo(map);
  vignetiCalc.forEach(vc=>{
    const visibile = !!visibili[vc._id];
    if(visibile){
      if(!vc.layer) vc.layer = costruisciLayerVigneto(vc);
      if(!masterStruttura.hasLayer(vc.layer)) masterStruttura.addLayer(vc.layer);
    } else if(vc.layer && masterStruttura.hasLayer(vc.layer)){
      masterStruttura.removeLayer(vc.layer);
    }
  });
}

// Ripulisce completamente la cache dei layer costruiti finora: va chiamata SOLO quando
// cambia il DATASET importato (nuovo file, o cancellazione), mai per un semplice toggle di
// visibilità — altrimenti si perderebbe il vantaggio della cache appena descritta.
function svuotaCacheStruttura(){
  if(masterStruttura) masterStruttura.clearLayers();
  _formeViteReg.length = 0; // le viti a forma poligonale del dataset precedente non esistono più
}

// Solo le etichette dei filari: layer leggero, separato apposta da quello di viti/pali/filari
// perché è l'unico che deve essere ricalcolato quando cambia lo zoom o la rotazione (la
// direzione "verso l'esterno" e il "passo" anti-sovrapposizione dipendono da entrambi).
function aggiornaEtichette(){
  if(layerEtichette) map.removeLayer(layerEtichette);
  layerEtichette = L.featureGroup();
  if(!mostraEtichette && !mostraEtichetteVarieta){ layerEtichette.addTo(map); return; }
  const zoomCorrente = map.getZoom();

  vignetiCalc.forEach(vc=>{
    const id = vc._id;
    if(!visibili[id]) return;
    const { righe, getV, interFilare, lat } = vc.geom;

    // "Passo": con questo zoom, mostra un'etichetta ogni N filari (N=1 quando lo spazio
    // è sufficiente per etichettarli tutti). Calcolato una sola volta per vigneto perché
    // interFilare è lo stesso per tutti i filari del blocco.
    const passo = passoEtichette(lat, interFilare, zoomCorrente, LABEL_H);

    righe.forEach(r=>{
      if(r.fi % passo !== 0) return;

      // Direzione del filare calcolata sui pixel REALMENTE proiettati dei suoi due estremi.
      const p0 = map.latLngToLayerPoint(L.latLng(r.fLine[0]));
      const p1 = map.latLngToLayerPoint(L.latLng(r.fLine[1]));
      let dx = p1.x-p0.x, dy = p1.y-p0.y;
      const len = Math.hypot(dx,dy)||1;
      const outX = -dx/len, outY = -dy/len; // direzione opposta al filare = verso la capezzagna, prima della vite 1

      // BUG "etichette lontane a zoom ridotto": LABEL_D_NUM/VAR sono distanze FISSE in
      // pixel-schermo (per restare leggibili a qualunque zoom). Ma con zoom molto ridotto
      // (vista d'insieme) un filare lungo anche 50-100m in campo può proiettarsi in pochi
      // pixel sullo schermo: applicare comunque i 26-60px fissi fa sembrare l'etichetta
      // "staccata", molto più lontana del filare stesso — è esattamente il problema
      // segnalato, che sparisce avvicinandosi con lo zoom perché lì il filare torna a
      // occupare più pixel della distanza fissa. Soluzione: scalare la distanza in
      // proporzione alla lunghezza a schermo del filare (len), saturando al valore fisso
      // pieno non appena il filare supera gli 80px — cioè al normale zoom di lavoro in
      // campo (z18-20) il comportamento resta quello di sempre, invariato.
      const scalaOffset = Math.min(1, len/80);

      // IMPORTANTE: lo spostamento verso l'esterno non viene applicato con iconAnchor
      // (un meccanismo interno di Leaflet la cui interazione con la rotazione libera della
      // mappa non è affidabile — è la causa dello sfasamento delle etichette osservato a
      // mappa ruotata). Si calcola invece un vero punto geografico spostato in pixel e lo
      // si riconverte in lat/lng con layerPointToLatLng: essendo l'esatta funzione inversa
      // di latLngToLayerPoint, il punto risultante è per costruzione coerente a QUALUNQUE
      // rotazione/zoom della mappa. Il marcatore viene poi posizionato lì con un ancoraggio
      // semplice e fisso (nessuna matematica extra nel passaggio finale), esattamente come
      // già avviene — correttamente, a riprova — per viti e pali.
      function puntoEsterno(distanzaPx){
        return map.layerPointToLatLng(L.point(p0.x+outX*distanzaPx, p0.y+outY*distanzaPx));
      }

      if(mostraEtichette){
        const bw=32, bh=LABEL_H;
        L.marker(puntoEsterno(LABEL_D_NUM*scalaOffset), {
          icon: L.divIcon({
            className:'', iconAnchor:[bw/2, bh/2], iconSize:[bw,bh],
            html:`<div style="background:rgba(26,74,26,.94);color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.45);text-align:center">F${r.numero}</div>`
          }),
          interactive:false, rotateWithView:false
        }).addTo(layerEtichette);
      }

      if(mostraEtichetteVarieta){
        let testoVar, colVar;
        if(r.f.tipo==='mista'){ testoVar='Misto'; colVar='#9e9e9e'; }
        else if(r.f.tipo==='ampelo'){ testoVar='Ampelo'; colVar='#8e5fd1'; }
        else { const v=getV(r.f.varietaId); testoVar = v?v.nome:'—'; colVar = v?v.color:'#888'; }
        const bw2=Math.min(150, Math.max(70, 34+testoVar.length*6.2)), bh2=LABEL_H;
        L.marker(puntoEsterno(LABEL_D_VAR*scalaOffset), {
          icon: L.divIcon({
            className:'', iconAnchor:[bw2/2, bh2/2], iconSize:[bw2,bh2],
            html:`<div style="background:rgba(20,26,22,.94);color:#fff;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:4px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.45);display:inline-flex;align-items:center;gap:5px;overflow:hidden;text-overflow:ellipsis">`+
              `<span style="width:8px;height:8px;border-radius:50%;background:${colVar};flex-shrink:0;border:1px solid rgba(255,255,255,.4)"></span>`+
              `<b style="font-weight:700">F${r.numero}</b><span style="opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${testoVar}</span></div>`
          }),
          interactive:false, rotateWithView:false
        }).addTo(layerEtichette);
      }
    });
  });

  layerEtichette.addTo(map);
}

// Ridisegno completo: geometria + etichette. Usato quando cambiano i dati importati, la
// visibilità di un vigneto, o l'attivazione/disattivazione delle etichette — MAI collegato
// direttamente a zoom/rotazione (vedi pianificaAggiornaEtichette in initMap).
function disegnaVigneti(){
  disegnaStruttura();
  aggiornaEtichette();
}

function ricalcolaTutto(){
  vignetiCalc = vigneti.map((v,i)=>{
    const id = uidVigneto(v,i);
    const geom = calcolaGeomVigneto(v);
    return { _id:id, v, geom };
  }).filter(x=>x.geom); // scarta vigneti senza posizione GPS o senza filari

  const senzaPos = vigneti.length - vignetiCalc.length;
  document.getElementById('emptyState').style.display = vigneti.length===0 ? 'flex' : 'none';

  // Un nuovo import sostituisce interamente il dataset precedente: la cache dei layer
  // per-vigneto (pensata per velocizzare i toggle di visibilità, non per persistere tra
  // dataset diversi) va svuotata, altrimenti i vigneti del file precedente resterebbero
  // visibili "a fantasma" mescolati a quelli nuovi.
  svuotaCacheStruttura();
  disegnaVigneti();
  renderSheet();
  fitToVisibili();

  if(senzaPos>0) toast('⚠ '+senzaPos+' vigneto/i senza posizione GPS: posizionali nel planner (◎ Posiziona vigneto)', 4200);
}

function fitToVisibili(){
  const visibiliCalc = vignetiCalc.filter(vc=>visibili[vc._id]);
  if(!visibiliCalc.length) return;
  const bounds = L.latLngBounds([]);
  visibiliCalc.forEach(vc=>{
    vc.geom.righe.forEach(r=>{ bounds.extend(r.fLine[0]); bounds.extend(r.fLine[1]); });
  });
  if(bounds.isValid()) map.fitBounds(bounds, {padding:[40,40], maxZoom:18});
}

// ---------- GPS ----------
function statusPill(html, cls){
  document.getElementById('gpsStatus').innerHTML = html ? `<div class="pill ${cls||''}">${html}</div>` : '';
}

// Distanza approssimata in metri tra due punti [lat,lng] vicini (stessa approssimazione
// "piatta" già usata altrove nell'app per le conversioni gradi↔metri: sufficientemente
// precisa su poche decine di metri, l'unico caso d'uso qui).
function distanzaMetri(a, b){
  const dLat = (a[0]-b[0])*111320;
  const dLng = (a[1]-b[1])*111320*Math.cos(a[0]*Math.PI/180);
  return Math.hypot(dLat, dLng);
}

let ultimaPosCentrata = null; // ultima posizione GPS su cui la mappa si è ricentrata (per il throttling sotto)

function avviaGps(){
  if(!('geolocation' in navigator)){ toast('⚠ GPS non disponibile su questo dispositivo/browser'); return; }
  if(watchId!=null) return; // già attivo, evita di avviare due watch in parallelo
  statusPill('◎ Ricerca GPS…');
  watchId = navigator.geolocation.watchPosition(pos=>{
    const {latitude, longitude, accuracy} = pos.coords;
    statusPill(`◎ GPS attivo · precisione <b>${Math.round(accuracy)} m</b>`);
    const ll = [latitude, longitude];
    if(!gpsMarker){
      gpsMarker = L.circleMarker(ll, {radius:8, fillColor:'#1e88e5', fillOpacity:1, color:'#fff', weight:3}).addTo(map);
      gpsCircle = L.circle(ll, {radius:accuracy, color:'#1e88e5', weight:1, fillOpacity:.08}).addTo(map);
    } else {
      gpsMarker.setLatLng(ll);
      gpsCircle.setLatLng(ll); gpsCircle.setRadius(accuracy);
    }
    // Il GPS "chiacchiera" spesso con micro-oscillazioni di 1-2 metri anche da fermi:
    // ricentrare la mappa (con animazione) ad ogni singolo aggiornamento la fa sembrare
    // "nervosa". Si ricentra solo se ci si è mossi davvero (>1.5 m) e senza animazione,
    // per un aggancio alla posizione istantaneo e stabile invece che a scatti.
    if(followGps){
      const mossoAbbastanza = !ultimaPosCentrata || distanzaMetri(ll, ultimaPosCentrata) > 1.5;
      if(mossoAbbastanza){
        map.setView(ll, Math.max(map.getZoom(), 18), {animate:false});
        ultimaPosCentrata = ll;
      }
    }
  }, err=>{
    let msg = '⚠ GPS non disponibile';
    if(err.code===1) msg = '⚠ Permesso GPS negato: abilitalo nelle impostazioni del browser/telefono';
    else if(err.code===2) msg = '⚠ Posizione non disponibile';
    else if(err.code===3) msg = '⚠ Timeout ricerca GPS';
    statusPill(msg, 'err');
  }, { enableHighAccuracy:true, maximumAge:2000, timeout:15000 });
}

// Il GPS ad alta precisione consuma parecchia batteria: quando l'app va in background
// (schermo spento, altra app in primo piano) non ha senso continuare a localizzare — si
// sospende e si riprende automaticamente al ritorno in primo piano, per non tenere GPS
// e batteria impegnati inutilmente per ore durante una giornata di lavoro in campo.
function gestisciVisibilitaPagina(){
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){
      if(watchId!=null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
    } else {
      avviaGps();
    }
  });
}

document.getElementById('btnLocate').addEventListener('click', ()=>{

// Parete vegetativa = altezza totale impianto − altezza filo di banchina (capo a frutto) +
// altezza di cimatura. Stessa identica formula usata nel VignaPlanner desktop (v.struttura).
function calcParete(s){
  if(!s || !s.fili || !s.fili.length) return null;
  const banchina = s.fili.find(f=>f.banchina) || s.fili[0];
  const altezzaTotale = s.altezzaTotale!=null ? +s.altezzaTotale : Math.max(...s.fili.map(f=>+f.altezza||0));
  const cim = +s.cimatura || 0;
  const parete = Math.round((altezzaTotale-(+banchina.altezza||0)+cim)*10)/10;
  return { altezzaTotale, banchinaAltezza:+banchina.altezza||0, cim, parete };
}

function renderVigList(){
  const q = (document.getElementById('searchVig')?.value||'').toLowerCase();
  const list = document.getElementById('vigList');
  if(!list) return;
  list.innerHTML='';
  vigneti.forEach((v,i)=>{
    if(q && !(v.nome||'').toLowerCase().includes(q)) return;
    const id = uidVigneto(v,i);
    const hasGeo = vignetiCalc.some(vc=>vc._id===id);
    const on = !!visibili[id];
    const varsTop = Object.entries(v.varSet||{}).slice(0,4);
    const meta = v.meta||{};

    // Tutti i dati descrittivi del vigneto disponibili nel file esportato dal desktop
    // (stessi campi mostrati nella scheda vigneto del planner): si mostra solo quello
    // che è effettivamente presente/valorizzato per quel vigneto.
    const chips = [];
    if(meta.sistPot) chips.push(['Sistema', meta.sistPot]);
    if(meta.comune) chips.push(['Comune', meta.comune]);
    if(meta.annoImpianto!=null) chips.push(['Anno impianto', meta.annoImpianto]);
    if(meta.interFilare!=null) chips.push(['Interfilare', meta.interFilare+' m']);
    if(meta.distPali!=null) chips.push(['Dist. pali', meta.distPali+' m']);
    if(meta.altSpalliera) chips.push(['Spalliera', meta.altSpalliera+' m']);
    if(meta.nFili) chips.push(['Fili', meta.nFili]);
    const parete = v.struttura ? calcParete(v.struttura) : null;
    if(parete) chips.push(['Parete veg.', parete.parete+' cm']);
    if(v.mapPos?.lat!=null){
      chips.push(['Lat', v.mapPos.lat.toFixed(6)+'°N']);
      chips.push(['Lng', v.mapPos.lng.toFixed(6)+'°E']);
    } else {
      chips.push(['Posizione', 'non impostata']);
    }

    // Struttura verticale dell'impianto (pali, fili, cimatura): stessi dati e stessa
    // formula di calcolo della parete vegetativa usati nella scheda "Struttura" del
    // planner desktop, mostrati per intero (non solo il risultato finale della parete).
    let strutturaHtml = '';
    if(v.struttura && v.struttura.fili && v.struttura.fili.length){
      const s = v.struttura;
      const filiHtml = s.fili.map((f,fi)=>
        `<span class="vs-filo${f.banchina?' banchina':''}">${f.banchina?'Banchina':'Filo '+(fi+1)} · <b>${f.altezza} cm</b> · ${f.tipo==='coppia'?'coppia':'singolo'}${f.diametro?' · Ø'+f.diametro+'mm':''}</span>`
      ).join('');
      strutturaHtml = `
        <div class="vig-struttura">
          <div class="vs-title">Struttura verticale</div>
          <div class="vs-row"><span class="vml">Palo di testa</span><span class="vmv">${s.paloTesta??'—'} cm</span> &nbsp; <span class="vml">Palo intermedio</span><span class="vmv">${s.paloIntermedio??'—'} cm</span></div>
          <div class="vs-fili">${filiHtml}</div>
          <div class="vs-row"><span class="vml">Altezza totale</span><span class="vmv">${parete?parete.altezzaTotale:(s.altezzaTotale??'—')} cm</span> &nbsp; <span class="vml">Cimatura</span><span class="vmv">${s.cimatura??'—'} cm</span>${parete?` &nbsp; <span class="vml">Parete veg.</span><span class="vmv">${parete.parete} cm</span>`:''}</div>
        </div>`;
    }

    const div = document.createElement('div');
    div.className = 'vig-item'+(hasGeo?'':' disabled');
    div.innerHTML = `
      <div class="vi-top">
        <div>
          <h4>${v.nome||'(vigneto senza nome)'}</h4>
          <div class="vi-meta">
            <span>${v.totFilari||0} filari</span><span>${v.totPiante||0} viti</span><span>${v.ha||'—'} ha</span>
            ${!hasGeo?'<span style="color:var(--accent)">⚠ senza GPS</span>':''}
          </div>
        </div>
        <div class="chk ${on?'on':''}">${on?'✓':''}</div>
      </div>
      <div class="vi-vars">${varsTop.map(([n,c])=>`<span class="vtag">${n} ×${c}</span>`).join('')}</div>
      <div class="vig-meta-grid">${chips.map(([l,val])=>`<span class="vmi"><span class="vml">${l}</span><span class="vmv">${val}</span></span>`).join('')}</div>
      ${strutturaHtml}
      ${v.note?`<div class="vig-note">${v.note}</div>`:''}
    `;
    div.addEventListener('click', ()=>{
      if(!hasGeo){ toast('⚠ Vigneto senza coordinate GPS: posizionalo nel planner desktop'); return; }
      visibili[id] = !visibili[id];
      salvaVisibilita();
      disegnaVigneti();
      renderVigList();
      if(visibili[id]){
        const vc = vignetiCalc.find(x=>x._id===id);
        const bounds = L.latLngBounds([]);
        vc.geom.righe.forEach(r=>{bounds.extend(r.fLine[0]);bounds.extend(r.fLine[1]);});
        if(bounds.isValid()){ closeSheet(); map.fitBounds(bounds,{padding:[40,40], maxZoom:18}); }
      }
    });
    list.appendChild(div);
  });
  if(!list.children.length) list.innerHTML = '<p style="color:var(--text2);font-size:13px">Nessun risultato.</p>';
}

// Per ogni varietà, individua in quali filari (di quale vigneto) compare, scandendo le
// piante di ogni filare — funziona sia per filari mono-varietà sia misti/ampelografici.
function raccogliDatiVarieta(){
  const tot = {};
  vigneti.forEach(v=>{
    const meta = v.meta||{};
    const filari = v.filari||[];
    const vars = v.vars||[];
    const getVar = id=>vars.find(x=>x.id===id)||null;

    filari.forEach((f,fi)=>{
      const numero = meta.invertFilari ? filari.length-fi : fi+1;
      const idsPresenti = new Set();
      (f.piante||[]).forEach(p=>{ if(p.varietaId!=null) idsPresenti.add(p.varietaId); });
      if(!idsPresenti.size && f.varietaId!=null) idsPresenti.add(f.varietaId); // fallback filare mono
      idsPresenti.forEach(id=>{
        const vr = getVar(id);
        if(!vr) return;
        if(!tot[vr.nome]) tot[vr.nome] = {color:vr.color, n:0, byVigneto:{}};
        if(!tot[vr.nome].byVigneto[v.nome]) tot[vr.nome].byVigneto[v.nome] = new Set();
        tot[vr.nome].byVigneto[v.nome].add(numero);
      });
    });
    // conteggio totale viti per varietà: usa il totale già calcolato dal planner (più affidabile)
    Object.entries(v.varSet||{}).forEach(([n,c])=>{
      if(!tot[n]) tot[n] = {color:null, n:0, byVigneto:{}};
      tot[n].n += c;
    });
  });
  return tot;
}

function renderVarieta(){
  const body = document.getElementById('sheetBody');
  const tot = raccogliDatiVarieta();
  const entries = Object.entries(tot).sort((a,b)=>b[1].n-a[1].n);
  if(!entries.length){ body.innerHTML = '<p style="color:var(--text2);font-size:13px">Nessuna varietà disponibile: importa prima un file.</p>'; return; }
  const multiVigneto = vigneti.length>1;
  body.innerHTML = `<input class="search-box" id="searchVar" placeholder="Cerca varietà…"><div id="varList"></div>`;
  function draw(){
    const q = document.getElementById('searchVar').value.toLowerCase();
    const list = document.getElementById('varList');
    list.innerHTML = entries.filter(([n])=>n.toLowerCase().includes(q)).map(([n,d])=>{
      const gruppi = Object.entries(d.byVigneto).map(([vname,set])=>{
        const numeri = Array.from(set).sort((a,b)=>a-b).map(x=>'F'+x).join(', ');
        const prefisso = multiVigneto ? `${vname}: ` : '';
        return `<span class="ftag">${prefisso}<b>${numeri}</b></span>`;
      }).join('');
      return `<div class="var-item">
        <span class="vc" style="background:${d.color||'#888'}"></span>
        <div class="vi-main">
          <div class="vn-row"><span class="vn">${n}</span><span class="vcount">${d.n} viti</span></div>
          <div class="var-filari">${gruppi||'<span class="ftag">nessun filare individuato</span>'}</div>
        </div>
      </div>`;
    }).join('') || '<p style="color:var(--text2);font-size:13px">Nessun risultato.</p>';
  }
  document.getElementById('searchVar').addEventListener('input', draw);
  draw();
}

function renderInfo(){

  const totPiante = vigneti.reduce((s,v)=>s+(v.totPiante||0),0);

      I dati restano salvati sul telefono anche offline. Per aggiornarli, esporta di nuovo il JSON da VignaPlanner desktop (scheda “▣ Vigneti” → “↓ Esporta JSON”) e ricaricalo qui: sostituirà i dati precedenti.
    </p>`;
  document.getElementById('btnReimport').addEventListener('click', ()=>fileInput.click());
  document.getElementById('btnClear').addEventListener('click', ()=>{

// ---------- avvio ----------
window.addEventListener('load', ()=>{
  // Leaflet e il plugin di rotazione arrivano da CDN esterni: se al primissimo avvio il
  // telefono non ha connessione (prima che il service worker li abbia messi in cache),
  // 'L' non esiste e l'app, senza questo controllo, si bloccherebbe in silenzio con una
  // mappa vuota e nessun pulsante funzionante. Meglio un messaggio chiaro e un modo per
  // riprovare, così l'utente capisce cosa succede invece di pensare che l'app sia rotta.
  if(typeof L === 'undefined'){
    document.getElementById('mapWrap').innerHTML = `
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:30px;text-align:center;background:var(--bg)">
        <div style="font-size:40px;opacity:.6">⚠</div>
        <h2 style="margin:0;font-size:17px">Impossibile caricare la mappa</h2>
        <p style="margin:0;color:var(--text2);font-size:13.5px;max-width:320px;line-height:1.5">
          Al primo avvio serve una connessione dati per scaricare i componenti della mappa
          (una sola volta: dopo funzionano anche offline). Controlla la connessione e riprova.
        </p>
        <button class="btn" onclick="location.reload()">Riprova</button>
      </div>`;
    return;
  }
  try{
    initMap();
    caricaLocale();
    document.getElementById('btnLabels').classList.toggle('fab-on', mostraEtichette);
    document.getElementById('btnLabelsVar').classList.toggle('fab-on', mostraEtichetteVarieta);
    ricalcolaTutto();
    avviaGps();
    gestisciVisibilitaPagina();
  }catch(e){
    console.error(e);
    toast('⚠ Si è verificato un problema all\'avvio. Prova a ricaricare l\'app.', 5000);
  }
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
});
</script>
</body>
